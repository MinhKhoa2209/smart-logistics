services:
  # Ollama - local AI embedding model (~4GB download, required for semantic search)
  # Run separately: docker-compose -f docker-compose.ollama.yml up -d
  ollama:
    image: ollama/ollama:latest
    container_name: smartlogistic-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  ollama_data:
