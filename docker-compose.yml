services:
  # PostgreSQL with pgvector
  db:
    image: pgvector/pgvector:pg17
    container_name: smartlogistic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_logistics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartlogistic-backend
    restart: unless-stopped
    environment:
      # Use app_user (no BYPASSRLS) so RLS policies are enforced at the DB level
      DATABASE_URL: postgresql://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-smart_logistics}
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartlogistic-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama_data:
