services:
  # PostgreSQL with pgvector
  db:
    image: pgvector/pgvector:pg17
    container_name: smartlogistic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_logistics}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ensure the non-superuser application role exists even when reusing an old DB volume
  db-init:
    image: pgvector/pgvector:pg17
    container_name: smartlogistic-db-init
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_password}
    volumes:
      - ./database/app_user.sql:/tmp/app_user.sql:ro
    command:
      [
        "sh",
        "-c",
        "psql -h db -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_logistics} -v app_user=\"$${APP_DB_USER}\" -v app_password=\"$${APP_DB_PASSWORD}\" -f /tmp/app_user.sql"
      ]
    depends_on:
      db:
        condition: service_healthy

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartlogistic-backend
    restart: unless-stopped
    environment:
      # Use app_user (no BYPASSRLS) so RLS policies are enforced at the DB level
      DATABASE_URL: postgresql://${APP_DB_USER:-app_user}:${APP_DB_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-smart_logistics}
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
    ports:
      - "3000:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartlogistic-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama_data:
